<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odeyale Praise Oluwatobi - Portfolio</title>
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      line-height: 1.6;
    }
    a {
      color: #007acc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }
    /* Header */
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    header p {
      font-size: 1.2rem;
      color: #555;
    }
    /* Navigation */
    nav {
      text-align: center;
      margin: 20px 0 40px;
    }
    nav a {
      margin: 0 15px;
      font-weight: 600;
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    nav a:hover {
      background-color: #007acc;
      color: white;
    }
    /* Sections */
    section {
      margin-bottom: 60px;
    }
    section h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      border-bottom: 3px solid #007acc;
      display: inline-block;
      padding-bottom: 5px;
    }
    /* Skills list */
    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .skill {
      background-color: #007acc;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      user-select: none;
    }
    /* Contact info */
    .contact-info {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 20px;
      text-align: center;
    }
    .contact-info a {
      color: #007acc;
      font-weight: 600;
      text-decoration: none;
    }
    .contact-info a:hover {
      text-decoration: underline;
    }
    /* Contact form */
    form {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label {
      font-weight: 600;
      margin-bottom: 5px;
    }
    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      resize: vertical;
      transition: border-color 0.3s ease;
    }
    input:focus, textarea:focus {
      border-color: #007acc;
      outline: none;
    }
    button {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #005fa3;
    }
    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 0.9rem;
      border-top: 1px solid #ddd;
    }
    /* Responsive adjustments */
    @media (max-width: 600px) {
      header h1 {
        font-size: 2.2rem;
      }
      section h2 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Odeyale Praise Oluwatobi</h1>
      <p>Web Developer & Designer</p>
    </header>

    <nav>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>

    <section id="skills">
      <h2>Skills</h2>
      <div class="skills-list">
        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">JavaScript</span>
        <span class="skill">Designing of Posters and Flyers</span>
      </div>
    </section>

    <section id="contact">
      <h2>Contact Me</h2>
      <div class="contact-info">
        <p>Phone / WhatsApp: <a href="tel:+234816877773">08168777773</a> | <a href="tel:+2348060977449">08060977449</a></p>
      </div>
      <form action="mailto:your.email@example.com" method="POST" enctype="text/plain">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Your email" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="Your message"></textarea>

        <button type="submit">Send</button>
      </form>
    </section>

    <footer>
      &copy; 2026 Odeyale Praise Oluwatobi. All rights reserved.
    </footer>
  </div>
</body>
</html>
